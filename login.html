<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | BCTS</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="card">
    <div class="avatar"><img src="logo.png" alt="BCTS logo"></div>

    <div class="tabs" role="tablist">
      <button type="button" class="active" id="tabLogin" role="tab">Login</button>
      <button type="button" id="tabSignup" role="tab">Sign Up</button>
    </div>

    <div class="error" id="error" role="alert"></div>

    <form id="form" novalidate>
      <div id="nameField" class="hidden">
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="submit" id="submit" type="submit">Submit</button>
    </form>

    <div class="center" id="forgotWrap"><button type="button" class="link" id="forgot">Forgot your password?</button></div>

    <div class="divider">or continue with</div>
    <div class="social">
      <button type="button" data-provider="google">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
      <button type="button" data-provider="facebook">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.12 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.34l-.53 3.49h-2.81V24C19.61 23.09 24 18.1 24 12.07z"/></svg>
        Facebook
      </button>
    </div>

    <p class="switch"><span id="switchText">Don't have an account?</span> <button type="button" id="switchBtn">Create an account</button></p>
  </main>

  <dialog id="socialDialog">
    <h2 id="socialTitle">Continue</h2>
    <p>Enter your email and password. A new email creates a new account. Demo only: do not use your real Google or Facebook password.</p>
    <div class="error" id="socialError" role="alert"></div>
    <form id="socialForm" novalidate>
      <label for="socialEmail">Email</label>
      <input id="socialEmail" type="email" autocomplete="email">
      <label for="socialPassword">Password</label>
      <input id="socialPassword" type="password" autocomplete="off">
      <button class="submit" type="submit">Continue</button>
      <div class="center"><button type="button" class="link" id="socialCancel">Cancel</button></div>
    </form>
  </dialog>

  <script src="auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
